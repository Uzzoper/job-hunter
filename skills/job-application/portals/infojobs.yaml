# Portal field mapping: InfoJobs — issue #45.
# Flat dotted keys (field.<name>.<attr>) parsed by apply.py's YAML subset parser.
# Selectors are best-effort: InfoJobs markup may vary.

portal: infojobs

# Optional form URL builder; {job_id} is replaced with the URL slug.
form_url_pattern: "https://www.infojobs.com.br/vaga/{job_id}"

# Best-effort apply-button selector on the job listing page.
apply_button_selector: "button[id='apply']"

# Application-form fields in fill order.
fields.name.selector: "input[name='nome']"
fields.name.type: fill
fields.name.source: name

fields.email.selector: "input[name='email']"
fields.email.type: fill
fields.email.source: email

fields.phone.selector: "input[name='telefone']"
fields.phone.type: fill
fields.phone.source: phone

fields.cv_upload.selector: "input[type='file']"
fields.cv_upload.type: upload
fields.cv_upload.source: cv_path

fields.cover_letter.selector: "textarea[name='mensagem']"
fields.cover_letter.type: fill
fields.cover_letter.source: cover_text

# Submit is only ever emitted when apply.py runs with --confirmed.
fields.submit.selector: "button[type='submit']"
fields.submit.type: submit

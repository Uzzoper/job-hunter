name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (fmt + checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run fmt and checkstyle (if plugins configured)
        run: |
          if grep -q "fmt-maven-plugin" pom.xml; then
            ./mvnw fmt:check --batch-mode
          else
            echo "fmt-maven-plugin not configured — skipping"
          fi
          if grep -q "maven-checkstyle-plugin" pom.xml; then
            ./mvnw checkstyle:check --batch-mode
          else
            echo "maven-checkstyle-plugin not configured — skipping"
          fi

  cli:
    name: CLI (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Lint with clippy
        run: cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

  scraper:
    name: Scraper (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: linkedin-scraper/package-lock.json

      - name: Install dependencies
        working-directory: linkedin-scraper
        run: npm ci

      - name: Type check
        working-directory: linkedin-scraper
        run: npx tsc --noEmit
name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    name: Scraper (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: linkedin-scraper/package-lock.json

      - name: Install dependencies
        working-directory: linkedin-scraper
        run: npm ci

      - name: Type check
        working-directory: linkedin-scraper
        run: npx tsc --noEmit

services:
  linkedin-scraper:
    build:
      context: ./linkedin-scraper
      dockerfile: Dockerfile
    container_name: job-hunter-linkedin-scraper
    ports:
      # Loopback only: the scraper drives a real browser and has no auth —
      # never publish it on a public interface.
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>r.json()).then(d=>process.exit(d.data.status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-hunter-backend
    ports:
      # X-Bot-Token protected; bound to localhost — nothing needs off-host access
      - "127.0.0.1:8080:8080"
    environment:
      HERMES_API_KEY: ${HERMES_API_KEY:?HERMES_API_KEY must be set (fail-fast)}
      HERMES_MODEL: ${HERMES_MODEL:-default}
      # X-Bot-Token is the only auth; startup fails fast when this is blank.
      # Set it in the gitignored .env. Never hardcode here.
      BOT_SERVICE_API_KEY: ${BOT_SERVICE_API_KEY:?BOT_SERVICE_API_KEY must be set (fail-fast)}
      # Optional legacy selector: only for V13 migration / pre-refactor resume PDFs.
      BOT_SERVICE_OWNER_USER_ID: ${BOT_SERVICE_OWNER_USER_ID:-}
    volumes:
      # SQLite database file lives on the host (./data/jobhunter.db)
      - ./data:/app/data
      # Resume uploads must survive container recreation
      - ./uploads:/app/uploads
    depends_on:
      linkedin-scraper:
        condition: service_started
    restart: unless-stopped

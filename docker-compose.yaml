services:
  postgres:
    image: postgres:16-alpine
    container_name: job-hunter-db
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - job_hunter_data:/var/lib/postgresql/data

  linkedin-scraper:
    build:
      context: ./linkedin-scraper
      dockerfile: Dockerfile
    container_name: job-hunter-linkedin-scraper
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>r.json()).then(d=>process.exit(d.data.status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  job_hunter_data:
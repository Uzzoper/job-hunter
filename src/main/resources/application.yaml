spring:
  application:
    name: job-hunter

  datasource:
    url: jdbc:postgresql://localhost:5433/jobhunter
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 24

ai:
  openrouter:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY}
    model: poolside/laguna-s-2.1:free
    timeout-seconds: 30

scraper:
  retry:
    max-attempts: 3
    base-delay-millis: 1000
    max-delay-millis: 30000
    max-jitter-millis: 2000
  rate-limiter:
    default-permits-per-second: 5
    default-burst: 3
  normalizer:
    max-age-days: 90
  gupy:
    base-url: https://employability-portal.gupy.io
    keywords: desenvolvedor,programador,estágio,junior,ti,tecnologia,dev,software,analista
    limit: 100
    timeout-seconds: 10
  infojobs:
    base-url: https://www.infojobs.com.br
    keywords: desenvolvedor,programador,estágio,junior,ti,tecnologia,dev,software,analista
    max-pages: 3
    timeout-seconds: 10
  linkedin:
    enabled: true
    mode: service          # "service" (Playwright) | "jsoup" (current, fallback)
    service-url: http://linkedin-scraper:3000
    connect-timeout-seconds: 5
    base-url: https://www.linkedin.com
    keywords: "desenvolvedor,programador,estágio,junior,ti,tecnologia,dev,software,analista"
    locations: "Brazil,São Paulo,Rio de Janeiro,Curitiba,Remote"
    geo-ids: "106057199,102927786,105972731,105906364"
    seniority: "entry_level"
    work-type: "remote,hybrid,on-site"
    time-range: "past_week"
    max-jobs: 25
    timeout-seconds: 30
    detail-fetch-delay-millis: 500

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:4200"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"



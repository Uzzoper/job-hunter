spring:
  application:
    name: job-hunter

  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/jobhunter.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # Passed to the xerial sqlite-jdbc driver as connection pragmas; WAL keeps reads
      # concurrent with scraper/scheduler writes. WAL persists in the database file.
      data-source-properties:
        journal_mode: WAL

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate validate is unusable on SQLite because the
      # xerial driver reports DATE/TIMESTAMP columns as VARCHAR through DatabaseMetaData.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 24

ai:
  resume-extraction:
    max-chars: 8000    # max characters sent to AI; text exceeding this is truncated with a warning
  resume-tailoring:
    max-chars: 8000    # max chars of resume text sent to AI; longer text is truncated with a warning
  analysis:
    max-resume-chars: 8000       # job analysis prompt: resume excerpt limit (match-quality spec)
    max-description-chars: 8000  # job analysis prompt: job description limit (match-quality spec)

scraper:
  # NOTE: scraper.retry.* governs scraper and company-enrichment callers only.
  # AI adapters do not retry (docs/specs/hermes-only-ai.md).
  retry:
    max-attempts: 3
    base-delay-millis: 1000
    max-delay-millis: 30000
    max-jitter-millis: 2000
  rate-limiter:
    default-permits-per-second: 5
    default-burst: 3
  rest-client:
    # sources the shared scraperRestClient read/connect timeout (also used for InfoJobs search pages)
    timeout-seconds: 10
    max-connections: 20
  normalizer:
    max-age-days: 90
  gupy:
    base-url: https://employability-portal.gupy.io
    keywords: desenvolvedor,programador,estágio,junior,ti,tecnologia,dev,software,analista
    limit: 100
    timeout-seconds: 10
  infojobs:
    base-url: https://www.infojobs.com.br
    keywords: desenvolvedor,programador,estágio,junior,ti,tecnologia,dev,software,analista
    max-pages: 3
    timeout-seconds: 10
    detail-concurrency: 2
    # Honored by the dedicated infojobsDetailRestClient bean (5s) for InfoJobs detail-page
    # fetches; search pages keep the shared 10s scraper.rest-client.timeout-seconds.
    detail-timeout-seconds: 5
    max-detail-fetch: 100
  enricher:
    enabled: true
    timeout-seconds: 5
    max-pages-per-company: 2
    concurrency: 2
    per-domain-permits-per-second: 1
    cache-ttl-hours: 24
    contact-paths: /contato,/contact,/trabalhe-conosco,/carreiras
    # async-company-enrichment spec: batch enrichment endpoint bounds (jobs per run).
    batch-default-limit: 50
    batch-max-limit: 200
  linkedin:
    enabled: true
    mode: service          # "service" (Playwright) | "jsoup" (current, fallback)
    service-url: http://linkedin-scraper:3000
    connect-timeout-seconds: 5
    base-url: https://www.linkedin.com
    keywords: "desenvolvedor,programador,estágio,junior,ti,tecnologia,dev,software,analista"
    locations: "Brazil,São Paulo,Rio de Janeiro,Curitiba,Remote"
    # Single LinkedIn geo ID (Brazil). Verified live: repeated geoIds return an
    # empty search page, and the other IDs were not Brazil (Peru/UK/invalid).
    geo-ids: "106057199"
    seniority: "entry_level"
    work-type: "remote,hybrid,on-site"
    time-range: "past_week"
    max-jobs: 60
    timeout-seconds: 30
    detail-fetch-delay-millis: 500
    base-job-url: https://www.linkedin.com/jobs/view/

ats:
  # ATS board providers (Greenhouse/Ashby/Lever) — disabled by default until the
  # junior-relevance sample is confirmed (docs/specs/ats-provider.md §7).
  enabled: false
  timeout-seconds: 30
  # NOTE: board lists MUST stay CSV, never YAML flow style ([a, b]): @Value
  # List<String> binding silently resolves flow style to an empty list on
  # Spring Boot 4.0.6 (proven live: 0 boards configured vs CSV working).
  greenhouse-boards: stone,xpinc,c6bank,gympass,quintoandar,ebanx,thoughtworks,vtex,feedzai,elastic,gitlab,remotecom,grafanalabs,mozilla,monzo,tailscale,wikimedia
  ashby-boards: nubank,notion,cursor,preply,replit,linear,zapier
  lever-sites: dlocal,outreach,metabase
  lever-page-size: 100            # Lever pagination page size (spec §4)
  lever-max-pages: 3              # hard cap per site, mirrors scraper.infojobs.max-pages (PR#84 P2-a)
  # Company label per board (Ashby/Lever responses carry no company). Injected via
  # @Value("#{${ats.display-names}}") — must stay a single-line SpEL map literal
  # (nested YAML maps flatten into per-key properties and cannot be resolved).
  display-names: "{nubank: 'Nubank', notion: 'Notion', cursor: 'Cursor', preply: 'Preply', replit: 'Replit', linear: 'Linear', zapier: 'Zapier', dlocal: 'dLocal', outreach: 'Outreach', metabase: 'Metabase'}"

auto-send:
  enabled: false
  require-review: true
  interval-seconds: 120
  jitter-seconds: 30
  daily-cap: 50

email:
  max-resume-chars: 8000    # email generation prompt: resume excerpt limit (match-quality spec)
  standard-template:
    min-match-score: 60     # below this score the standard template is used, AI path above (match-quality spec)

# Hermes Agent gateway ("hermes gateway run") — the single AI backend for
# analysis and email generation, and the email-sending bot transport. The bot
# needs an email tool (himalaya CLI) configured in its profile for delivery to
# actually happen.
hermes:
  base-url: http://localhost:9119/v1   # clients append /chat/completions — the /v1 suffix is mandatory (404 without it)
  api-key: ${HERMES_API_KEY}           # required; the context fails fast without it
  model: ${HERMES_MODEL:default}       # model pinned on the Bot profile
  timeout-seconds: 120

bot:
  memory:
    # Directory where the Hermes jobhunter-bot profile stores memory files.
    # ${user.home} resolves via the system user.home; the backend and the bot
    # run as the same OS user so local java.nio.file.Files access is safe.
    dir: ${user.home}/.hermes/profiles/jobhunter-bot
    memory-file: memories/MEMORY.md
    user-file: memories/USER.md
  service:
    # Static service token for self-hosted bot API access (issue #47).
    # Blank api-key disables the feature; header X-Bot-Token must match exactly.
    # No expiry — rotate the key and restart the backend to revoke.
    api-key: ${BOT_SERVICE_API_KEY:}
    # Existing user the bot acts as; must be a positive id for the feature to engage.
    owner-user-id: ${BOT_SERVICE_OWNER_USER_ID:}

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:4200"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
  upload-dir: ./uploads/resumes



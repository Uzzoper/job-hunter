spring:
  application:
    name: job-hunter

  datasource:
    url: jdbc:postgresql://localhost:5433/jobhunter
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 24

ai:
  openrouter:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY}
    model: minimax/minimax-m2.5:free
    timeout-seconds: 30

scraper:
  retry:
    max-attempts: 3
    base-delay-millis: 1000
    max-delay-millis: 30000
    max-jitter-millis: 2000
  rate-limiter:
    default-permits-per-second: 5
    default-burst: 3
  normalizer:
    max-age-days: 90
  gupy:
    base-url: https://employability-portal.gupy.io
    keywords: desenvolvedor,developer,engenheiro de software,software engineer,fullstack,full stack,backend,front-end,frontend,ti,tecnologia
    limit: 100
    timeout-seconds: 10
  infojobs:
    base-url: https://www.infojobs.com.br
    keywords: desenvolvedor junior,desenvolvedor júnior,analista desenvolvedor junior,programador junior,java junior,backend junior,desenvolvedor jr,programador jr,dev jr,java jr,backend jr,frontend jr,fullstack jr,c# jr,python jr,.net jr
    max-pages: 3
    timeout-seconds: 10

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:4200"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"



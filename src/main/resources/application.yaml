spring:
  application:
    name: job-hunter

  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/jobhunter.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # Passed to the xerial sqlite-jdbc driver as connection pragmas; WAL keeps reads
      # concurrent with scraper/scheduler writes. WAL persists in the database file.
      data-source-properties:
        journal_mode: WAL

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate validate is unusable on SQLite because the
      # xerial driver reports DATE/TIMESTAMP columns as VARCHAR through DatabaseMetaData.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 24

ai:
  resume-extraction:
    max-chars: 8000    # max characters sent to AI; text exceeding this is truncated with a warning
  resume-tailoring:
    max-chars: 8000    # max chars of resume text sent to AI; longer text is truncated with a warning
  analysis:
    max-resume-chars: 8000       # job analysis prompt: resume excerpt limit (match-quality spec)
    max-description-chars: 8000  # job analysis prompt: job description limit (match-quality spec)

scraper:
  # NOTE: scraper.retry.* governs scraper and company-enrichment callers only.
  # AI adapters do not retry (docs/specs/hermes-only-ai.md).
  retry:
    max-attempts: 3
    base-delay-millis: 1000
    max-delay-millis: 30000
    max-jitter-millis: 2000
  rate-limiter:
    default-permits-per-second: 5
    default-burst: 3
  rest-client:
    # sources the shared scraperRestClient read/connect timeout (also used for InfoJobs search pages)
    timeout-seconds: 10
    max-connections: 20
  normalizer:
    max-age-days: 90
  gupy:
    base-url: https://employability-portal.gupy.io
    # 9-term include list — the single canonical keyword list for EVERY provider that
    # reads gupy keywords (REST, MCP, normalizers). CSV format (see ats.* binding note).
    keywords: desenvolvedor,programador,estágio,junior,ti,tecnologia,dev,software,analista
    limit: 100
    timeout-seconds: 10
    # gupy-detail-domains spec (#74): companyWebsite is resolved from one detail page
    # per career-page host; hosts beyond this cap per fetch are logged and skipped.
    # Keep this cap >= limit above: a fetch can never overflow its own cap, which
    # is what the backfill straggler guarantee ("covered going forward") relies on.
    # Single live key: read via scraper.gupy.max-detail-domains by the two
    # Gupy beans (MCP default + REST hatch), which pass the cap into the
    # detail-domain resolver — NO gupy.* root mirror exists.
    max-detail-domains: 100
  infojobs:
    base-url: https://www.infojobs.com.br
    keywords: desenvolvedor,programador,estágio,junior,ti,tecnologia,dev,software,analista
    max-pages: 3
    timeout-seconds: 10
    detail-concurrency: 2
    # Honored by the dedicated infojobsDetailRestClient bean (5s) for InfoJobs detail-page
    # fetches; search pages keep the shared 10s scraper.rest-client.timeout-seconds.
    detail-timeout-seconds: 5
    max-detail-fetch: 100
  enricher:
    enabled: true
    timeout-seconds: 5
    max-pages-per-company: 2
    concurrency: 2
    per-domain-permits-per-second: 1
    cache-ttl-hours: 24
    contact-paths: /contato,/contact,/trabalhe-conosco,/carreiras
    # async-company-enrichment spec: batch enrichment endpoint bounds (jobs per run).
    # Raised 50 -> 200 (gupy-detail-domains §3, link-quality v3): with 1199 valid
    # domains already resolved and pending email, the batch cap — not domain
    # resolution — is the funnel bottleneck. Reversible: lower it back to 50.
    batch-default-limit: 200
    batch-max-limit: 200
  linkedin:
    # Gates BOTH LinkedIn strategies (fase-a-sourcing-restoration Scenario 8):
    # mode selects *which* (jsoup/service), enabled selects *whether* (default true).
    enabled: true
    mode: service          # "service" (Playwright) | "jsoup" (current, fallback)
    service-url: http://linkedin-scraper:3000
    connect-timeout-seconds: 5
    base-url: https://www.linkedin.com
    # Order matters: the merge loop fills max-jobs in list order, each term
    # contributing up to its per-keyword quota (ceil(max-jobs / keywords.size())),
    # so junior compounds come first (P1-3 — a broad "desenvolvedor" first would
    # spend its quota share on senior-heavy results before junior terms contribute).
    keywords: "desenvolvedor junior,dev junior,programador junior,estagio desenvolvedor"
    locations: "Brazil,São Paulo,Rio de Janeiro,Curitiba,Remote"
    # Single LinkedIn geo ID (Brazil). Verified live: repeated geoIds return an
    # empty search page, and the other IDs were not Brazil (Peru/UK/invalid).
    geo-ids: "106057199"
    seniority: "entry_level"
    # Amendment B (linkedin-search-facets spec): forwarding all three work models
    # was a no-op filter; narrowed to remote+hybrid (the elimination gate already
    # rejects onsite downstream). Facets are forwarded to the scraper service,
    # which maps only live-verified native codes (Amendment A — f_TPR time-range
    # is verified; f_WT/f_E are NOT honored by the guest SSR page and pass through
    # with a log.warn until a logged-in session verifies them).
    work-type: "remote,hybrid"
    time-range: "past_week"
    max-jobs: 60
    timeout-seconds: 30          # detail/enrichment read timeout (deliberate pacing, unchanged)
    search-timeout-seconds: 180  # heavy paginated /api/jobs search read timeout — must cover the measured 145.67s live search (issue #120)
    detail-fetch-delay-millis: 500
    base-job-url: https://www.linkedin.com/jobs/view/
    # Enrichment pacing (issue #99): permit rate/burst for the dedicated "linkedin"
    # bucket of the shared rateLimiter bean (overrides map). Detail enrichment takes
    # one permit per job; other providers keep the shared defaults unchanged.
    enrich-permits-per-second: 1.0
    enrich-burst: 1
    jsoup:
      # Pagination cap for the jsoup fallback strategy (mode: jsoup) — binds the
      # LinkedInProvider record knob (fase-a-sourcing-restoration Scenario 8).
      # Previously record-default unbound (0 → the fallback fetched zero pages).
      max-pages: 3

# Gupy MCP gateway — the sole live Gupy source. MCP strategy is default-on;
# keywords + detail-domain knobs live under scraper.gupy.* (one canonical home).
# Probe evidence (fase-a-sourcing-restoration.md Context, probed 2026-10-23):
#   REST  GET employability-portal.gupy.io/api/v1/jobs?jobName=… → nginx 404
#   MCP   GET candidates.mcp.api.gupy.io/mcp                    → JSON-RPC 405
#         (formal expect-POST response — the MCP server is alive; Gupy MCP verified
#          live on 2026-10-04 per docs/specs/gupy-mcp-provider.md §1)
gupy:
  enabled: true                    # GupyMcpProvider registered by default (fase-a Scenario 1)
  # Dead-gateway regression hatch: the REST provider returns ONLY with this flag
  # (never both strategies serve "gupy" — the registry prefers MCP). Full code
  # deletion follows in Phase B once MCP volume is proven.
  rest:
    enabled: false
  mcp-url: https://candidates.mcp.api.gupy.io/mcp   # single endpoint, no auth
  timeout-seconds: 30
  limit: 100        # MCP per-query limit — the MCP strategy's single limit knob;
                    # the legacy REST hatch keeps its own scraper.gupy.limit
  max-jobs: 200     # merged cap across queries (junior-first ordering mitigates head-overlap)

ats:
  # ATS board providers (Greenhouse/Ashby/Lever) — ENABLED in fase A
  # (docs/specs/fase-a-sourcing-restoration.md A2). Board tokens below are curated
  # externally (librarian lane) and were VERIFIED live before shipping — see the
  # "board tokens VERIFIED" note alongside the lists. A board returning 404/empty
  # is logged and skipped, never aborting the fetch cycle (ats-provider.md:63-67).
  enabled: true
  timeout-seconds: 30
  # NOTE: board lists MUST stay CSV, never YAML flow style ([a, b]): @Value
  # List<String> binding silently resolves flow style to an empty list on
  # Spring Boot 4.0.6 (proven live: 0 boards configured vs CSV working).
  # -- board tokens VERIFIED live on 2026-10-23: every token answered its public
  # API with HTTP 200 + >=1 job (fase-a-sourcing-restoration.md A2, Scenario 3).
  # Curator candidate tokens verified alive but dropped as non-eng-BR noise:
  # figma/pinterest/ripple/twilio (Greenhouse), alternative: comment them back in.
  # Counts snapshot: stone 369, btgpactual 258, c6bank 162, quintoandar 108, xpinc 131,
  # vtex 31, ebanx 40, brex 257, datadog 440, coinbase 223, gitlab 231, databricks 898,
  # rdstation 7, agilize 7, nubank 97, supabase 59, belvo 3, snyk 33, ciandt 176,
  # neon 8, dlocal 50, spotify 80, kavak 9, despegar 111 (drifts daily).
  greenhouse-boards: stone,btgpactual,c6bank,quintoandar,xpinc,vtex,ebanx,brex,datadog,coinbase,gitlab,databricks,rdstation,agilize
  ashby-boards: nubank,supabase,belvo,snyk
  lever-sites: ciandt,neon,dlocal,spotify,kavak,despegar
  lever-page-size: 100            # Lever pagination page size (spec §4)
  lever-max-pages: 3              # hard cap per site, mirrors scraper.infojobs.max-pages (PR#84 P2-a)
  # Company label per board (Ashby/Lever responses carry no company). Injected via
  # @Value("#{${ats.display-names}}") — must stay a single-line SpEL map literal
  # (nested YAML maps flatten into per-key properties and cannot be resolved).
  # -- display names map covers exactly the verified ashby-boards + lever-sites tokens
  display-names: "{nubank: 'Nubank', supabase: 'Supabase', belvo: 'Belvo', snyk: 'Snyk', ciandt: 'CI&T', neon: 'Neon', dlocal: 'dLocal', spotify: 'Spotify', kavak: 'Kavak', despegar: 'Despegar'}"

github:
  # GitHub "jobs" community boards (frontendbr/backend-br) — ENABLED in fase A
  # (docs/specs/fase-a-sourcing-restoration.md A2). Open issues with hiring labels
  # surface as jobs (github-jobs.md), deduped by URL like every other provider.
  enabled: true
  timeout-seconds: 30
  # Owner/repo pairs, CSV (never YAML flow style — @Value List<String> binds flow style
  # to an empty list on Spring Boot 4.0.6, proven live on the ats.* lists).
  # -- repos verified public & active (community hiring boards, backend-br/vagas junior-rich)
  repos: frontendbr/vagas,backend-br/vagas

auto-send:
  enabled: false
  require-review: true
  interval-seconds: 120
  jitter-seconds: 30
  daily-cap: 50

email:
  max-resume-chars: 8000    # email generation prompt: resume excerpt limit (match-quality spec)
  standard-template:
    min-match-score: 60     # below this score the standard template is used, AI path above (match-quality spec)

# Hermes Agent gateway ("hermes gateway run") — the single AI backend for
# analysis and email generation, and the email-sending bot transport. The bot
# needs an email tool (himalaya CLI) configured in its profile for delivery to
# actually happen.
hermes:
  base-url: http://127.0.0.1:8642/p/jobhunter-bot/v1   # clients append /chat/completions — the /v1 suffix is mandatory (404 without it)
  api-key: ${HERMES_API_KEY}           # required; the context fails fast without it
  model: ${HERMES_MODEL:default}       # model pinned on the Bot profile
  timeout-seconds: 120
  # ingest-base-url: http://127.0.0.1:8642/p/jobhunter-ingest/v1
  #   Optional dedicated Hermes profile for the ingest classifier. When
  #   absent (default), ingest falls back to base-url (the shared profile)
  #   and logs a startup WARN. Provision the profile on the VM — the repo
  #   only consumes the property. Keep the mandatory /v1 suffix.

bot:
  memory:
    # Directory where the Hermes jobhunter-bot profile stores memory files.
    # ${user.home} resolves via the system user.home; the backend and the bot
    # run as the same OS user so local java.nio.file.Files access is safe.
    dir: ${user.home}/.hermes/profiles/jobhunter-bot
    memory-file: memories/MEMORY.md
    user-file: memories/USER.md
  service:
    # Static service token for self-hosted bot API access (issue #47).
    # Blank api-key disables the feature; header X-Bot-Token must match exactly.
    # No expiry — rotate the key and restart the backend to revoke.
    api-key: ${BOT_SERVICE_API_KEY:}
    # Existing user the bot acts as; must be a positive id for the feature to engage.
    owner-user-id: ${BOT_SERVICE_OWNER_USER_ID:}

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:4200"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
  upload-dir: ./uploads/resumes



[package]
name = "jh-cli"
version = "0.1.0"
edition = "2024"
description = "Job Hunter CLI — TUI and batch client for the Job Hunter API"
authors = ["Juan Peruzzo"]
license = "MIT"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"
scopeguard = "1"

# Local cache
rusqlite = { version = "0.34", features = ["bundled"] }

# CSV export
csv = "1.3"

# Clipboard
arboard = "3"

# Open URLs in browser
open = "5"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# File paths
dirs-next = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Secure password input (no echo)
rpassword = "7"

[dev-dependencies]
httpmock = "0.7"
regex = "1.13"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
